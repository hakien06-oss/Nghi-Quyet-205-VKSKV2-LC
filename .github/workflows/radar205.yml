name: Radar205 Daily Scan

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run radar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python radar205.py

      - name: Save bot data
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add radar205_cache.json || true
          git add subscribers.json || true
          git add telegram_updates.json || true

          git commit -m "update radar data" || echo "No changes"

          git pull --rebase || true

          git push || echo "GitHub push skipped"
