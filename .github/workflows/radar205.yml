name: Radar205 Daily Scan

on:
  workflow_dispatch:

# Không cho 2 lần chạy cùng lúc (tránh gửi trùng và xung đột file cache)
concurrency:
  group: radar205
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run radar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python radar205.py

      - name: Save bot data
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add radar205_cache.json subscribers.json telegram_updates.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "update radar data"
          # Thử push tối đa 5 lần; nếu thất bại thì BÁO LỖI (không im lặng bỏ qua)
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            echo "Push lần $i thất bại, thử lại..."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 3))
          done
          echo "::error::Không push được dữ liệu cache -> lần sau sẽ gửi lặp tin"
          exit 1
